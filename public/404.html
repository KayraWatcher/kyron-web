<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>KYRON</title>
    <script>
      // Hash routing kullanıldığı için bilinmeyen bir path'e gelinirse
      // ana sayfaya yönlendir. Böylece GitHub Pages'in çıplak 404'ü görünmez.
      window.location.replace('./' + window.location.hash)
    </script>
  </head>
  <body>
    <p><a href="./">KYRON ana sayfasına dön</a></p>
  </body>
</html>
